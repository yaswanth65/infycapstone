<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px 0;">
  <div class="glass-panel" style="width: 100%; max-width: 480px; padding: 32px; border-radius: 20px;">
    
    <!-- Tab Controls -->
    <div style="display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; padding-bottom: 8px;">
      <button (click)="setTab('login')" class="tab-btn" [class.active]="activeTab === 'login'" style="flex: 1; text-align: center;">
        🔑 Sign In
      </button>
      <button (click)="setTab('signup')" class="tab-btn" [class.active]="activeTab === 'signup'" style="flex: 1; text-align: center;">
        ✨ Sign Up as Attendee
      </button>
    </div>

    <!-- Title Banner -->
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 6px;">
        {{ activeTab === 'login' ? 'Sign In to EventHub' : 'Create Attendee Account' }}
      </h2>
      <p style="color: var(--text-muted); font-size: 0.85rem;">
        {{ activeTab === 'login' ? 'Select a quick demo role or enter your credentials.' : 'Register now to explore events and join waitlists.' }}
      </p>
    </div>

    <!-- Error / Success Alert -->
    <div *ngIf="errorMessage" class="badge badge-closed" style="width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 10px; font-size: 0.85rem; justify-content: center; text-transform: none;">
      ⚠️ {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="badge badge-attended" style="width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 10px; font-size: 0.85rem; justify-content: center; text-transform: none;">
      ✅ {{ successMessage }}
    </div>

    <!-- TAB 1: LOGIN FORM -->
    <div *ngIf="activeTab === 'login'">
      <!-- Quick Demo Logins -->
      <div style="margin-bottom: 20px;">
        <label class="form-group" style="margin-bottom: 8px;"><span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Quick Demo Credentials</span></label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button type="button" (click)="quickLogin('admin')" class="btn btn-secondary btn-sm" style="justify-content: flex-start;">
            ⚙️ Admin
          </button>
          <button type="button" (click)="quickLogin('manager')" class="btn btn-secondary btn-sm" style="justify-content: flex-start;">
            📅 Manager
          </button>
          <button type="button" (click)="quickLogin('business')" class="btn btn-secondary btn-sm" style="justify-content: flex-start;">
            💼 Executive
          </button>
          <button type="button" (click)="quickLogin('attendee')" class="btn btn-secondary btn-sm" style="justify-content: flex-start;">
            🙋 Attendee
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; margin: 16px 0; color: var(--text-dim);">
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        <span style="padding: 0 12px; font-size: 0.75rem; text-transform: uppercase;">or manual login</span>
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="emailOrUserName">Email or Username</label>
          <input type="text" id="emailOrUserName" [(ngModel)]="emailOrUserName" name="emailOrUserName" class="input-field" placeholder="Enter username or email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" class="input-field" placeholder="••••••••" required>
        </div>

        <button type="submit" [disabled]="isLoading" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading">Authenticating...</span>
        </button>
      </form>
    </div>

    <!-- TAB 2: SIGNUP FORM -->
    <div *ngIf="activeTab === 'signup'">
      <form (ngSubmit)="onSignupSubmit()">
        <div class="form-group">
          <label for="signupEmail">Email Address *</label>
          <input type="email" id="signupEmail" [(ngModel)]="signupModel.email" name="email" class="input-field" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="signupUserName">Username *</label>
          <input type="text" id="signupUserName" [(ngModel)]="signupModel.userName" name="userName" class="input-field" placeholder="johndoe" required>
        </div>

        <div class="form-group">
          <label for="signupDisplayName">Display Name *</label>
          <input type="text" id="signupDisplayName" [(ngModel)]="signupModel.displayName" name="displayName" class="input-field" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="signupPhone">Phone Number</label>
          <input type="text" id="signupPhone" [(ngModel)]="signupModel.phoneNumber" name="phoneNumber" class="input-field" placeholder="9998887770">
        </div>

        <div class="form-group">
          <label for="signupPassword">Password *</label>
          <input type="password" id="signupPassword" [(ngModel)]="signupModel.password" name="password" class="input-field" placeholder="Create password" required>
        </div>

        <button type="submit" [disabled]="isLoading" class="btn btn-emerald" style="width: 100%; margin-top: 12px; padding: 12px;">
          <span *ngIf="!isLoading">Create Attendee Account</span>
          <span *ngIf="isLoading">Creating Account...</span>
        </button>
      </form>
    </div>

  </div>
</div>
